services:
  - type: web
    name: pack-musical-player
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: GDRIVE_FOLDERS
        sync: false
      - key: VIDEO_FOLDERS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BUY_URL
        sync: false
      - key: PREVIEW_SECONDS
        value: "0"
      - key: SHUFFLE
        value: "true"
      - key: SITE_TITLE
        value: MÚSICA Y MÁS
      - key: SITE_SUBTITLE
        value: Escucha, busca y disfruta toda la música
      - key: PRICE_BEFORE
        value: $60.000
      - key: PRICE_NOW
        value: $12.900
      - key: WHATSAPP_NUMBER
        sync: false
