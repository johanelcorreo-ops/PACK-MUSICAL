services:
  - type: web
    name: pack-musical-player
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: GDRIVE_FOLDERS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BUY_URL
        sync: false
      - key: PREVIEW_SECONDS
        value: "45"
      - key: SHUFFLE
        value: "true"
      - key: SITE_TITLE
        value: Pack Musical
