<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f45"/>
      <stop offset="0.55" stop-color="#4a1c8c"/>
      <stop offset="1" stop-color="#d1307e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#ff7ac3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7ac3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#08080c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>

  <!-- Disco de vinilo -->
  <g transform="translate(700 360)">
    <circle r="300" fill="url(#vinyl)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
      <circle r="270"/><circle r="245"/><circle r="220"/><circle r="195"/>
      <circle r="170"/><circle r="145"/><circle r="120"/>
    </g>
    <path d="M -230 -150 A 275 275 0 0 1 -60 -265" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle r="95" fill="url(#label)"/>
    <circle r="12" fill="#1b0f45"/>
  </g>

  <!-- Ondas de sonido -->
  <g fill="url(#gold)" transform="translate(0 -55)">
    <rect x="80" y="420" width="22" height="70" rx="11"/>
    <rect x="118" y="385" width="22" height="140" rx="11"/>
    <rect x="156" y="405" width="22" height="100" rx="11"/>
    <rect x="194" y="360" width="22" height="190" rx="11"/>
    <rect x="232" y="395" width="22" height="120" rx="11"/>
    <rect x="270" y="425" width="22" height="60" rx="11"/>
  </g>

  <!-- Notas musicales -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(110 150) rotate(-12)">
      <ellipse cx="0" cy="60" rx="26" ry="19"/>
      <rect x="20" y="-20" width="9" height="82"/>
      <path d="M 29 -20 q 40 10 34 50 q -8 -26 -34 -24 z"/>
    </g>
    <g transform="translate(330 230) rotate(10) scale(0.7)">
      <ellipse cx="0" cy="60" rx="26" ry="19"/>
      <rect x="20" y="-20" width="9" height="82"/>
      <path d="M 29 -20 q 40 10 34 50 q -8 -26 -34 -24 z"/>
    </g>
  </g>

  <!-- Título -->
  <g font-family="'Anton', 'Bebas Neue', Impact, 'Arial Black', sans-serif" text-anchor="start">
    <text x="70" y="760" font-size="215" font-weight="900" fill="#ffffff" letter-spacing="2">MÚSICA</text>
    <text x="74" y="900" font-size="150" font-weight="900" fill="url(#gold)" letter-spacing="4">Y MÁS</text>
  </g>
  <text x="530" y="890" font-family="'Montserrat', 'Arial', sans-serif" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.85" letter-spacing="6">PACK MUSICAL</text>
  <text x="530" y="930" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="600" fill="#ffd84d" letter-spacing="4">TODOS LOS GÉNEROS</text>
</svg>
