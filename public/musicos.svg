    <circle cx="88" cy="46" r="23" fill="currentColor"/>
    <path d="M158 58 L196 40 L196 96 L158 74 Z" fill="currentColor"/>
    <rect x="128" y="60" width="22" height="12" rx="3" fill="currentColor"/>
  </symbol>

  <!-- Bailarina -->
  <symbol id="bailarina" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 84 L104 150" stroke-width="34"/>
      <path d="M90 92 L58 64 L40 26" stroke-width="15"/>
      <path d="M112 90 L148 80 L170 46" stroke-width="15"/>
      <path d="M112 214 L148 252 L172 250" stroke-width="20"/>
      <path d="M94 216 L84 254 L82 290" stroke-width="20"/>
    </g>
    <circle cx="100" cy="46" r="22" fill="currentColor"/>
    <path d="M82 46 Q70 70 80 92" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
    <path d="M86 140 L122 140 L150 222 L62 222 Z" fill="currentColor"/>
    <circle cx="40" cy="22" r="8" fill="currentColor"/>
    <circle cx="172" cy="42" r="8" fill="currentColor"/>
