      <path d="M78 166 L64 228 L58 288" stroke-width="22"/>
      <path d="M92 166 L110 226 L122 286" stroke-width="22"/>
      <path d="M94 94 L120 90 L132 70" stroke-width="15"/>
      <path d="M78 98 L96 120 L144 72" stroke-width="15"/>
      <path d="M108 56 L162 64" stroke-width="9"/>
