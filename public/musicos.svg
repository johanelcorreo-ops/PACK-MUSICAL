    <circle cx="100" cy="46" r="22" fill="currentColor"/>
    <ellipse cx="100" cy="30" rx="44" ry="9" fill="currentColor"/>
    <path d="M80 30 Q82 6 100 6 Q118 6 120 30 Z" fill="currentColor"/>
    <!-- acordeón (con fuelles marcados para que se distinga del cuerpo) -->
    <rect x="44" y="106" width="112" height="64" rx="8" fill="currentColor"/>
    <g stroke="#0d0820" stroke-width="4" opacity=".7">
      <path d="M70 110 L70 166 M84 110 L84 166 M98 110 L98 166 M112 110 L112 166 M126 110 L126 166"/>
    </g>
    <g fill="#0d0820" opacity=".7">
      <circle cx="54" cy="122" r="3.5"/><circle cx="54" cy="138" r="3.5"/><circle cx="54" cy="154" r="3.5"/>
      <circle cx="144" cy="122" r="3.5"/><circle cx="144" cy="138" r="3.5"/><circle cx="144" cy="154" r="3.5"/>
    </g>
  </symbol>

  <!-- DJ con audífonos -->
  <symbol id="dj" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 86 L100 176" stroke-width="40"/>
      <path d="M86 96 L56 70 L46 28" stroke-width="16"/>
      <path d="M114 100 L144 140 L130 182" stroke-width="16"/>
      <path d="M72 46 Q72 12 100 12 Q128 12 128 46" stroke-width="7"/>
    </g>
    <circle cx="100" cy="46" r="23" fill="currentColor"/>
    <rect x="64" y="36" width="12" height="24" rx="5" fill="currentColor"/>
    <rect x="124" y="36" width="12" height="24" rx="5" fill="currentColor"/>
    <circle cx="46" cy="24" r="10" fill="currentColor"/>
    <!-- consola -->
    <rect x="18" y="186" width="164" height="34" rx="8" fill="currentColor"/>
    <rect x="34" y="220" width="12" height="70" rx="4" fill="currentColor"/>
    <rect x="154" y="220" width="12" height="70" rx="4" fill="currentColor"/>
    <ellipse cx="62" cy="182" rx="30" ry="8" fill="currentColor" opacity=".55"/>
    <ellipse cx="140" cy="182" rx="30" ry="8" fill="currentColor" opacity=".55"/>
  </symbol>

