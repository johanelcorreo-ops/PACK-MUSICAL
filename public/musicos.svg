<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Músicos ilustrados originales (estilo pictograma). Se pintan con el color del texto (currentColor). -->

  <!-- Cantante con micrófono -->
  <symbol id="cantante" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 80 L100 160" stroke-width="40"/>
      <path d="M90 88 L58 66 L44 30" stroke-width="17"/>
      <path d="M110 90 L150 108 L150 76" stroke-width="17"/>
      <path d="M92 162 L78 226 L70 286" stroke-width="22"/>
      <path d="M108 162 L126 224 L140 284" stroke-width="22"/>
      <path d="M150 76 L141 52" stroke-width="8"/>
    </g>
    <circle cx="96" cy="42" r="23" fill="currentColor"/>
    <circle cx="138" cy="44" r="11" fill="currentColor"/>
    <circle cx="44" cy="26" r="9" fill="currentColor"/>
  </symbol>

  <!-- Guitarrista -->
  <symbol id="guitarrista" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 82 L92 162" stroke-width="40"/>
      <path d="M86 166 L70 228 L62 288" stroke-width="22"/>
      <path d="M100 166 L120 226 L134 286" stroke-width="22"/>
      <path d="M128 132 L182 64" stroke-width="10"/>
      <path d="M176 58 L190 44" stroke-width="14"/>
      <path d="M104 92 L150 104 L166 86" stroke-width="16"/>
      <path d="M86 94 L74 132 L104 146" stroke-width="16"/>
    </g>
    <circle cx="98" cy="42" r="23" fill="currentColor"/>
    <g transform="rotate(-38 110 150)" fill="currentColor">
      <ellipse cx="96" cy="150" rx="30" ry="24"/>
      <ellipse cx="132" cy="150" rx="22" ry="18"/>
    </g>
    <circle cx="112" cy="146" r="7" fill="#0d0820" opacity=".55"/>
  </symbol>

  <!-- Acordeonero con sombrero -->
  <symbol id="acordeonero" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 84 L100 162" stroke-width="40"/>
      <path d="M92 164 L80 226 L72 286" stroke-width="22"/>
      <path d="M108 164 L122 226 L130 286" stroke-width="22"/>
      <path d="M84 94 L50 116 L52 128" stroke-width="16"/>
      <path d="M116 94 L150 116 L148 128" stroke-width="16"/>
